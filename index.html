<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hutt Garden">
<meta name="theme-color" content="#1e1c1a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>The Hutt's Family Garden</title>
<style>
:root {
    --green-dark:#1a3a20;--green-mid:#2d5a3f;--green-light:#d4a843;
    --green-pale:rgba(212,168,67,0.1);--earth-dark:#2a1808;--earth-mid:#3a2510;
    --wood:#7a5a20;--wood-light:#5a4210;--bg:#1e1c1a;
    --white:#2a2725;--text:#ede6d3;--text-light:#9a8a75;
    --shadow:rgba(0,0,0,0.35);--border:#3a3530;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
     padding-bottom:env(safe-area-inset-bottom,0)}

/* Header */
header{background:linear-gradient(135deg,#1a3a20 0%,#22432a 30%,#2a1808 100%);color:#ede6d3;padding:1rem 1.5rem;padding-top:calc(env(safe-area-inset-top,0px) + 1rem);text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.4);position:relative}
header h1{font-size:1.6rem;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,0.4)}
header h1 .leaf{color:#d4a843}
.hdr-sub{font-size:.82rem;color:#d4a843;margin-top:.15rem}
.hdr-stats{display:flex;justify-content:center;gap:1rem;margin-top:.5rem;flex-wrap:wrap}
.hdr-stat{background:rgba(0,0,0,.3);padding:.2rem .7rem;border-radius:20px;font-size:.78rem;color:#ede6d3;border:1px solid #3a3530}
.hdr-stat strong{color:#d4a843;text-shadow:0 0 12px rgba(212,168,67,0.15)}
.conn-status{position:absolute;top:.6rem;right:1rem;font-size:.7rem;padding:.15rem .5rem;border-radius:10px;background:rgba(0,0,0,.2)}
.conn-ok{color:#d4a843}.conn-off{color:#c0392b}

/* Garden Map */
.map-wrap{max-width:1000px;margin:1.2rem auto;padding:0 .8rem}
.map-hint{text-align:center;color:#9a8a75;font-size:.85rem;margin-bottom:.6rem}
.garden-map{position:relative;width:100%;padding-bottom:62.5%;background:linear-gradient(170deg,#3a4a2a 0%,#2e3d22 40%,#2a3520 100%);border-radius:14px;border:3px solid #3a3530;overflow:hidden;box-shadow:0 4px 16px var(--shadow)}
.house{position:absolute;top:0;left:8%;right:8%;height:7%;background:linear-gradient(180deg,#3a3530,#2a2725);display:flex;align-items:center;justify-content:center;color:#9a8a75;font-size:.7rem;font-weight:600;letter-spacing:1px;border-bottom:3px solid #4a4540}

/* Map beds */
.map-bed{position:absolute;border-radius:5px;cursor:pointer;border:1.5px solid rgba(212,168,67,0.15);transition:transform .15s,box-shadow .15s;z-index:10;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.map-bed:hover{transform:scale(1.06);z-index:20;box-shadow:0 4px 14px rgba(212,168,67,.25);border-color:#d4a843}
.map-bed.tall{background:linear-gradient(135deg,#7a5a20,#5a4210)}
.map-bed.ground{background:linear-gradient(135deg,#3a2510,#2a1808)}
.map-bed-label{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:.45rem;font-weight:600;color:rgba(237,230,211,.7);background:rgba(0,0,0,.5);padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-dot{position:absolute;border-radius:50%;width:6px;height:6px;transform:translate(-50%,-50%);pointer-events:none}

/* Map tooltip */
.map-tt{position:absolute;background:rgba(42,39,37,.95);color:#ede6d3;font-size:.75rem;line-height:1.4;padding:.5rem .7rem;border-radius:8px;border:1px solid #3a3530;pointer-events:none;opacity:0;transition:opacity .15s;z-index:100;max-width:200px}
.map-tt.vis{opacity:1}

/* Legend */
.legend{max-width:1000px;margin:.5rem auto;padding:0 1rem;display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.leg-item{display:flex;align-items:center;gap:.3rem;font-size:.75rem;background:#2a2725;padding:.2rem .6rem;border-radius:12px;box-shadow:0 1px 3px var(--shadow);color:#ede6d3;border:1px solid #3a3530}
.leg-sw{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ═══════ BED EDITOR ═══════ */
#bedEditor{position:fixed;inset:0;background:#1e1c1a;z-index:1000;display:none;flex-direction:column;overflow:hidden}
.ed-header{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;padding-top:calc(env(safe-area-inset-top,0px) + .8rem);background:linear-gradient(135deg,#1a3a20 0%,#22432a 30%,#2a1808 100%);color:#ede6d3;flex-shrink:0}
.ed-back{background:rgba(255,255,255,.1);border:1px solid #3a3530;color:#ede6d3;font-size:1rem;padding:.4rem .8rem;border-radius:8px;cursor:pointer;min-height:44px}
.bed-title{font-size:1.2rem;font-weight:700;flex:1}
.bed-title-input{font-size:1.2rem;font-weight:700;background:rgba(255,255,255,.1);border:1px solid #3a3530;color:#ede6d3;border-radius:6px;padding:.2rem .5rem;flex:1}
.ed-count{font-size:.8rem;opacity:.8;white-space:nowrap}

.ed-body{display:flex;flex:1;min-height:0;overflow:hidden}

/* Palette panel */
.pal-panel{width:260px;flex-shrink:0;background:#2a2725;border-right:1px solid #3a3530;display:flex;flex-direction:column;overflow:hidden}
.pal-panel input[type="text"]{width:100%;padding:.6rem .8rem;border:none;border-bottom:2px solid #3a3530;font-size:.9rem;outline:none;background:#302c28;color:#ede6d3}
.pal-panel input[type="text"]:focus{border-bottom-color:#d4a843}
.pal-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pal-item{display:flex;align-items:center;gap:.5rem;padding:.5rem .8rem;cursor:pointer;border-bottom:1px solid #3a3530;min-height:44px;color:#ede6d3}
.pal-item:hover{background:#3a3530}
.pal-item.selected{background:rgba(212,168,67,0.1);border-left:3px solid #d4a843;color:#ede6d3}
.pal-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.pal-emoji{font-size:1.1rem}
.pal-name{flex:1;font-size:.85rem;font-weight:500}
.pal-cat{font-size:.7rem;color:#9a8a75}

/* Bulk controls */
.bulk-row{display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem;border-top:2px solid #3a3530;flex-shrink:0;background:#302c28;flex-wrap:wrap}
.bulk-row label{font-size:.8rem;font-weight:600;color:#9a8a75}
.bulk-row input[type="number"]{width:55px;padding:.3rem;border:1px solid #3a3530;border-radius:6px;font-size:.9rem;text-align:center;background:#1e1c1a;color:#ede6d3}
.bulk-row select{padding:.3rem .4rem;border:1px solid #3a3530;border-radius:6px;font-size:.82rem;background:#1e1c1a;color:#ede6d3}
.bulk-btn{flex:1;padding:.45rem .5rem;background:linear-gradient(135deg,#d4a843,#c8942d);color:#1e1c1a;border:none;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;min-height:40px;box-shadow:0 2px 8px rgba(212,168,67,0.2)}
.bulk-btn:active{background:#c8942d}
.bulk-pos{display:flex;align-items:center;gap:.3rem;width:100%;margin-top:.2rem}
.bulk-pos label{font-size:.75rem;white-space:nowrap;color:#9a8a75}
.bulk-pos input[type="range"]{flex:1;accent-color:#d4a843}
.bulk-pos .pos-val{font-size:.75rem;min-width:32px;text-align:center;color:#d4a843;font-weight:600}

/* Bed canvas */
.canvas-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;min-width:0;overflow:auto;background:#22201e}
.bed-canvas{position:relative;width:100%;max-width:600px;padding-bottom:60%;background:linear-gradient(160deg,#22190e 0%,#1a1410 50%,#1e1810 100%);border-radius:12px;border:4px solid #3a3530;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair;box-shadow:inset 0 2px 8px rgba(0,0,0,.5),0 4px 12px var(--shadow)}
.canvas-hint{text-align:center;font-size:.8rem;color:#9a8a75;margin-top:.6rem}

/* Plant circles on canvas */
.plant-circle{position:absolute;width:40px;height:40px;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;cursor:grab;z-index:1;box-shadow:0 3px 10px rgba(0,0,0,.5);transition:box-shadow .12s,outline .12s;font-size:1rem;border:2px solid rgba(255,255,255,.2)}
.plant-circle:hover{box-shadow:0 4px 14px rgba(0,0,0,.6);z-index:10}
.plant-circle.dragging{cursor:grabbing;box-shadow:0 8px 24px rgba(0,0,0,.6);z-index:100;transition:none;transform:translate(-50%,-50%) scale(1.15)}
.plant-circle.selected-plant{outline:3px solid #d4a843;outline-offset:2px;z-index:50;box-shadow:0 0 12px rgba(212,168,67,0.3)}
.plant-delete-btn{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#5a2a1a;color:#c09a8a;border:2px solid #6a3a28;font-size:.7rem;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:200;line-height:1}

/* Plant summary (bottom list) */
.plant-summary{flex-shrink:0;max-height:30vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#2a2725;border-top:2px solid #3a3530;padding:.5rem .8rem}
.summary-title{font-size:.8rem;font-weight:700;color:#9a8a75;margin-bottom:.3rem}
.summary-item{display:flex;align-items:center;gap:.5rem;padding:.3rem 0;border-bottom:1px solid #3a3530;font-size:.85rem;color:#ede6d3}
.summary-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.summary-qty{font-weight:700;color:#d4a843;margin-left:auto;min-width:30px;text-align:right}
.summary-del{background:none;border:none;font-size:1rem;cursor:pointer;padding:.2rem;min-height:36px;min-width:36px;display:flex;align-items:center;justify-content:center}
.summary-empty{text-align:center;color:#9a8a75;font-size:.85rem;padding:1rem}

/* Data bar */
.data-bar{display:flex;justify-content:center;gap:.8rem;padding:.8rem 1rem;flex-wrap:wrap}
.data-btn{padding:.5rem 1rem;border:2px solid #3a3530;background:#2a2725;color:#ede6d3;border-radius:10px;font-size:.82rem;font-weight:600;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:.3rem}
.data-btn:active{background:#3a3530}
.data-btn input[type="file"]{display:none}

/* ═══════ MOBILE ═══════ */
@media(max-width:700px){
    header h1{font-size:1.3rem}
    .ed-body{flex-direction:column}
    .pal-panel{width:100%;max-height:40vh;border-right:none;border-bottom:1px solid #3a3530}
    .pal-list{max-height:20vh}
    .canvas-wrap{padding:.5rem;min-height:250px}
    .bed-canvas{max-width:100%}
    .plant-circle{width:36px;height:36px;font-size:.9rem}
    .map-bed-label{font-size:.35rem}
}
@media(max-width:380px){
    header{padding:.8rem}
    header h1{font-size:1.1rem}
    .pal-panel{max-height:35vh}
    .plant-circle{width:32px;height:32px;font-size:.8rem}
}
/* Auth bar */
.auth-bar{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.5rem 1rem;background:#22201e;border-bottom:1px solid #3a3530}
.auth-bar .user-info{font-size:.8rem;color:#9a8a75;display:flex;align-items:center;gap:.4rem}
.auth-bar .user-info img{width:22px;height:22px;border-radius:50%;border:1px solid #3a3530}
.auth-bar .user-name{color:#ede6d3;font-weight:600}
.auth-bar .role-badge{font-size:.7rem;padding:.1rem .5rem;border-radius:10px;font-weight:600}
.role-editor{background:rgba(212,168,67,.15);color:#d4a843;border:1px solid rgba(212,168,67,.3)}
.role-viewer{background:rgba(154,138,117,.15);color:#9a8a75;border:1px solid rgba(154,138,117,.3)}
.auth-btn{padding:.3rem .8rem;border-radius:8px;font-size:.78rem;font-weight:600;cursor:pointer;border:none;min-height:34px}
.auth-btn-sign-in{background:linear-gradient(135deg,#d4a843,#c8942d);color:#1e1c1a}
.auth-btn-sign-out{background:#3a3530;color:#9a8a75;border:1px solid #4a4540}
.readonly-banner{text-align:center;padding:.4rem;background:rgba(154,138,117,.1);color:#9a8a75;font-size:.78rem;border-bottom:1px solid #3a3530}
</style>
</head>
<body>

<!-- Auth bar -->
<div class="auth-bar" id="authBar">
    <span class="user-info" id="userInfo" style="display:none"></span>
    <button class="auth-btn auth-btn-sign-in" id="signInBtn" onclick="signIn()">🔐 Sign in with Google</button>
    <button class="auth-btn auth-btn-sign-out" id="signOutBtn" onclick="signOut()" style="display:none">Sign out</button>
</div>
<div class="readonly-banner" id="readonlyBanner" style="display:none">👁️ View-only mode — sign in with an authorized account to edit</div>

<header>
    <h1><span class="leaf">🌿</span> The Hutt's Family Garden</h1>
    <div class="hdr-sub">Tap a bed to add &amp; arrange plants</div>
    <div id="hdrStats" class="hdr-stats"></div>
    <div id="connStatus" class="conn-status conn-off">Connecting…</div>
</header>

<!-- ═══════ MAP VIEW ═══════ -->
<div id="mapView">
    <div class="map-wrap">
        <p class="map-hint">Tap a bed to edit</p>
        <div class="garden-map" id="gardenMap">
            <div class="house">House</div>
            <div id="mapTT" class="map-tt"></div>
        </div>
    </div>
    <div class="legend" id="mapLegend"></div>
</div>

<!-- ═══════ BED EDITOR ═══════ -->
<div id="bedEditor">
    <div class="ed-header">
        <button class="ed-back" onclick="closeBedEditor()">← Back</button>
        <span class="bed-title" id="bedTitle" ondblclick="startRenameBed()">Bed</span>
        <span class="ed-count" id="edCount">0 plants</span>
    </div>
    <div class="ed-body">
        <div class="pal-panel">
            <input type="text" id="palSearch" placeholder="🔍 Search (e.g. Roma Tomato)…" autocomplete="off">
            <div class="pal-list" id="palList"></div>
            <div class="bulk-row">
                <label>Qty:</label>
                <input type="number" id="bulkQty" value="1" min="1" max="99">
                <select id="bulkPattern" onchange="updateBulkUI()">
                    <option value="grid">Grid</option>
                    <option value="row">Horiz. Row</option>
                    <option value="col">Vert. Column</option>
                </select>
                <button class="bulk-btn" onclick="bulkPlace()">Place</button>
                <div class="bulk-pos" id="bulkPosWrap" style="display:none">
                    <label id="bulkPosLabel">Y position:</label>
                    <input type="range" id="bulkPos" min="5" max="95" value="50" oninput="document.getElementById('bulkPosVal').textContent=this.value+'%'">
                    <span class="pos-val" id="bulkPosVal">50%</span>
                </div>
            </div>
        </div>
        <div class="canvas-wrap">
            <div class="bed-canvas" id="bedCanvas"></div>
            <div class="canvas-hint" id="canvasHint">Select a plant from the list, then tap inside the bed to place it</div>
        </div>
    </div>
    <div class="plant-summary" id="plantSummary"></div>
</div>

<!-- Data bar -->
<div class="data-bar">
    <button class="data-btn" onclick="exportData()">📥 Export JSON</button>
    <label class="data-btn">📤 Import JSON<input type="file" id="importFile" accept=".json" onchange="importData(event)"></label>
    <button class="data-btn" onclick="resetData()">🔄 Reset All</button>
</div>

<!-- Firebase SDK (compat for script-tag usage) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

let DATA = { beds: {} };
let firebaseReady = false;

function genId() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return 'p' + Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
}

function defaultBeds() {
    const beds = {};
    BEDS.forEach(b => { beds[b.id] = { name: b.name, plants: {} }; });
    return beds;
}

        el.textContent = '🟢 Online';

    } else {

});

// Listen for real-time updates
bedsRef.on('value', snap => {
    const val = snap.val();
    if (val) {
        // Ensure all beds exist
        BEDS.forEach(b => {
            if (!val[b.id]) val[b.id] = { name: b.name, plants: {} };
            if (!val[b.id].plants) val[b.id].plants = {};
        });
        DATA.beds = val;
    } else {
        // First time — initialize
        DATA.beds = defaultBeds();
        bedsRef.set(DATA.beds);
    }
    renderMap();
    renderStats();
    if (currentBedId) renderBedCanvas();
    if (currentBedId) renderPlantSummary();
});

// Also try to load from localStorage for migration
(function checkMigration() {
    const old = localStorage.getItem('hutts-garden-v3');
    if (!old) return;
    try {
        const d = JSON.parse(old);
        if (d.version === 3 && Object.keys(d.beds).length) {
            // We have old lane-based data — offer migration
            setTimeout(() => {
                if (confirm('Found existing garden data on this device. Upload it to the cloud so all devices can see it?')) {
                    migrateV3toV4(d);
                }
                localStorage.removeItem('hutts-garden-v3');
            }, 2000);
        }
    } catch(e) {}
})();

function migrateV3toV4(oldData) {
    const newBeds = {};
    BEDS.forEach(def => {
        const old = oldData.beds[def.id];
        if (!old) { newBeds[def.id] = { name: def.name, plants: {} }; return; }
        const plants = {};
        const laneCount = old.lanes || 3;
        old.entries.forEach(entry => {
            const laneIdx = Math.max(0, Math.min(entry.lane - 1, laneCount - 1));
            const laneX = laneCount === 1 ? 50 : 10 + (laneIdx / (laneCount - 1)) * 80;
            for (let i = 0; i < entry.qty; i++) {
                const id = genId();
                const ySpread = entry.qty > 1 ? 8 + (i / (entry.qty - 1)) * 84 : 50;
                plants[id] = {
                    crop: entry.crop,
                    variety: entry.variety,
                    x: Math.round((laneX + (Math.random() - 0.5) * 6) * 10) / 10,
                    y: Math.round(ySpread * 10) / 10
                };
            }
        });
        newBeds[def.id] = { name: old.name || def.name, plants };
    });
    bedsRef.set(newBeds);
}

   STATS

function calcStats() {
    let total = 0;
    const varieties = new Set();
    Object.values(DATA.beds).forEach(b => {
        if (!b.plants) return;
        Object.values(b.plants).forEach(p => {
            total++;
            varieties.add(p.crop + "|" + p.variety);
        });
    });
    return { beds: BEDS.length, total, varieties: varieties.size };
}

function renderStats() {
    const s = calcStats();
    document.getElementById("hdrStats").innerHTML =
        `<div class="hdr-stat"><strong>${s.beds}</strong> beds</div>` +
        `<div class="hdr-stat"><strong>${s.varieties}</strong> varieties</div>` +
        `<div class="hdr-stat"><strong>${s.total}</strong> plants</div>`;
}

/* ═══════════════════════════════════════════════
   MAP VIEW
   ═══════════════════════════════════════════════ */
function renderMap() {
    const map = document.getElementById("gardenMap");
    map.querySelectorAll(".map-bed").forEach(e => e.remove());

    BEDS.forEach(def => {
        const bed = DATA.beds[def.id];
        if (!bed) return;
        const el = document.createElement("div");
        el.className = `map-bed ${def.type}`;
        el.style.left = def.mapPos.left;
        el.style.top = def.mapPos.top;
        el.style.width = def.mapPos.w;
        el.style.height = def.mapPos.h;

        // Render plant dots at their x,y positions within the bed
        if (bed.plants) {
            Object.values(bed.plants).forEach(p => {
                const info = findPlant(p.crop, p.variety);
                const dot = document.createElement("div");
                dot.className = "map-dot";
                dot.style.background = info.color;
                dot.style.left = p.x + "%";
                dot.style.top = p.y + "%";
                el.appendChild(dot);
            });
        }

        const lbl = document.createElement("div");
        lbl.className = "map-bed-label";
        lbl.textContent = bed.name;
        el.appendChild(lbl);

        el.addEventListener("click", () => openBedEditor(def.id));

        // Tooltip
        el.addEventListener("mouseenter", () => {
            const tt = document.getElementById("mapTT");
            const counts = {};
            if (bed.plants) {
                Object.values(bed.plants).forEach(p => {
                    const info = findPlant(p.crop, p.variety);
                    counts[info.displayName] = (counts[info.displayName] || 0) + 1;
                });
            }
            const lines = Object.entries(counts);
            tt.innerHTML = `<b>${bed.name}</b><br>` +
                (lines.length ? lines.map(([n, c]) => `${n} ×${c}`).join("<br>") : "<i>Empty</i>");
            tt.classList.add("vis");
        });
        el.addEventListener("mousemove", ev => {
            const tt = document.getElementById("mapTT");
            const r = map.getBoundingClientRect();
            tt.style.left = (ev.clientX - r.left + 14) + "px";
            tt.style.top = (ev.clientY - r.top - 12) + "px";
        });
        el.addEventListener("mouseleave", () => document.getElementById("mapTT").classList.remove("vis"));

        map.appendChild(el);
    });
    renderLegend();
}

function renderLegend() {
    const used = new Map();
    Object.values(DATA.beds).forEach(b => {
        if (!b.plants) return;
        Object.values(b.plants).forEach(p => {
            const k = p.crop + "|" + p.variety;
            if (!used.has(k)) used.set(k, findPlant(p.crop, p.variety));
        });
    });
    const el = document.getElementById("mapLegend");
    if (!used.size) { el.innerHTML = '<span style="color:#9e9e9e;font-size:.8rem">Plant something to see the legend</span>'; return; }
    el.innerHTML = Array.from(used.values()).sort((a, b) => a.displayName.localeCompare(b.displayName))
        .map(p => `<div class="leg-item"><div class="leg-sw" style="background:${p.color}"></div>${p.emoji} ${p.displayName}</div>`).join("");
}

/* ─── Palette ─── */
function renderPalette(filter) {
    const list = document.getElementById("palList");
    const q = (filter || "").toLowerCase().trim();
    const filtered = q ? PLANTS.filter(p => p._search.includes(q)) : PLANTS;
    list.innerHTML = filtered.map((p, i) => {
        const idx = PLANTS.indexOf(p);
        const sel = selectedPlant === p ? " selected" : "";
        return `<div class="pal-item${sel}" data-pidx="${idx}">
            <div class="pal-dot" style="background:${p.color}"></div>
            <span class="pal-emoji">${p.emoji}</span>
            <span class="pal-name">${p.displayName}</span>
            <span class="pal-cat">${p.cat}</span>
        </div>`;
    }).join("");

    list.querySelectorAll(".pal-item").forEach(el => {
        el.addEventListener("click", () => {
            selectedPlant = PLANTS[parseInt(el.dataset.pidx)];
            selectedPlantId = null; // deselect canvas plant when choosing from palette
            list.querySelectorAll(".pal-item").forEach(e => e.classList.remove("selected"));
            el.classList.add("selected");
            document.getElementById("canvasHint").textContent =
                `Tap inside the bed to place ${selectedPlant.displayName}`;
            renderBedCanvas(); // clear canvas selection
        });
    });
}

document.getElementById("palSearch").addEventListener("input", e => renderPalette(e.target.value));

/* ─── Bed Canvas ─── */
function renderBedCanvas() {
    if (!currentBedId) return;
    const bed = DATA.beds[currentBedId];
    const canvas = document.getElementById("bedCanvas");
    canvas.innerHTML = "";

    if (!bed.plants) return;

    const plantCount = Object.keys(bed.plants).length;
    document.getElementById("edCount").textContent = `${plantCount} plant${plantCount !== 1 ? 's' : ''}`;

    Object.entries(bed.plants).forEach(([id, plant]) => {
        const info = findPlant(plant.crop, plant.variety);
        const el = document.createElement("div");
        el.className = "plant-circle" + (id === selectedPlantId ? " selected-plant" : "");
        el.dataset.plantId = id;
        el.style.left = plant.x + "%";
        el.style.top = plant.y + "%";
        el.style.background = info.color;
        el.innerHTML = `<span>${info.emoji}</span>`;
        el.title = info.displayName;

        // Delete button for selected plant (editors only)
        if (id === selectedPlantId && canEdit()) {
            const del = document.createElement("div");
            del.className = "plant-delete-btn";
            del.textContent = "✕";
            del.addEventListener("pointerdown", e => {
                e.stopPropagation();
                e.preventDefault();
                deletePlant(currentBedId, id);
            });
            el.appendChild(del);
        }

        // Pointer events for drag
        el.addEventListener("pointerdown", e => startDrag(e, id));

        canvas.appendChild(el);
    });
}

// Click on empty canvas space to place a new plant
document.getElementById("bedCanvas").addEventListener("pointerdown", function(e) {
    if (e.target !== this) return;
    if (!selectedPlant || !canEdit()) return;

    const rect = this.getBoundingClientRect();
    const x = Math.round(((e.clientX - rect.left) / rect.width * 100) * 10) / 10;
    const y = Math.round(((e.clientY - rect.top) / rect.height * 100) * 10) / 10;
    const clamped_x = Math.max(3, Math.min(97, x));
    const clamped_y = Math.max(3, Math.min(97, y));

    const id = genId();
    const plantData = { crop: selectedPlant.crop, variety: selectedPlant.variety, x: clamped_x, y: clamped_y };

    if (!DATA.beds[currentBedId].plants) DATA.beds[currentBedId].plants = {};
    DATA.beds[currentBedId].plants[id] = plantData;
    bedsRef.child(`${currentBedId}/plants/${id}`).set(plantData);

    renderBedCanvas();
    renderPlantSummary();
});

/* ─── Drag ─── */
function startDrag(e, plantId) {
    if (!canEdit()) {
        // Allow tap-to-view but not drag
        selectedPlantId = plantId;
        renderBedCanvas();
        return;
    }
    e.preventDefault();
    e.stopPropagation();

    // If tapping the same plant, toggle selection
    if (selectedPlantId === plantId && !dragState) {
        selectedPlantId = null;
        renderBedCanvas();
        return;
    }

    const el = e.currentTarget;
    el.setPointerCapture(e.pointerId);

    const canvas = document.getElementById("bedCanvas");
    const rect = canvas.getBoundingClientRect();
    let moved = false;

    dragState = {
        plantId,
        el,
        startX: e.clientX,
        startY: e.clientY,
        origLeft: parseFloat(el.style.left),
        origTop: parseFloat(el.style.top),
        rect
    };

    el.classList.add("dragging");

    function onMove(ev) {
        if (!dragState) return;
        const dx = (ev.clientX - dragState.startX) / dragState.rect.width * 100;
        const dy = (ev.clientY - dragState.startY) / dragState.rect.height * 100;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) moved = true;

        const newX = Math.max(3, Math.min(97, dragState.origLeft + dx));
        const newY = Math.max(3, Math.min(97, dragState.origTop + dy));
        el.style.left = newX + "%";
        el.style.top = newY + "%";
    }

    function onUp(ev) {
        el.removeEventListener("pointermove", onMove);
        el.removeEventListener("pointerup", onUp);
        el.removeEventListener("pointercancel", onUp);
        el.removeEventListener("lostpointercapture", onUp);
        el.classList.remove("dragging");

        if (moved && dragState) {
            const newX = Math.round(parseFloat(el.style.left) * 10) / 10;
            const newY = Math.round(parseFloat(el.style.top) * 10) / 10;
            const bed = DATA.beds[currentBedId];
            if (bed.plants[dragState.plantId]) {
                bed.plants[dragState.plantId].x = newX;
                bed.plants[dragState.plantId].y = newY;
                bedsRef.child(`${currentBedId}/plants/${dragState.plantId}`).update({ x: newX, y: newY });
            }
        } else {
            // It was a tap — select the plant
            selectedPlantId = plantId;
            selectedPlant = null; // deselect palette
            document.querySelectorAll(".pal-item").forEach(e => e.classList.remove("selected"));
            document.getElementById("canvasHint").textContent = "Tap ✕ to delete, or drag to move";
            renderBedCanvas();
        }
        dragState = null;
    }

    el.addEventListener("pointermove", onMove);
    el.addEventListener("pointerup", onUp);
    el.addEventListener("pointercancel", onUp);
    el.addEventListener("lostpointercapture", onUp);
}

function deletePlant(bedId, plantId) {
    if (!canEdit()) return;
    if (DATA.beds[bedId].plants[plantId]) {
        delete DATA.beds[bedId].plants[plantId];
        bedsRef.child(`${bedId}/plants/${plantId}`).remove();
    }
    if (selectedPlantId === plantId) selectedPlantId = null;
    renderBedCanvas();
    renderPlantSummary();
}

/* ─── Bulk Place (structured patterns) ─── */
function updateBulkUI() {
    const pattern = document.getElementById("bulkPattern").value;
    const posWrap = document.getElementById("bulkPosWrap");
    const posLabel = document.getElementById("bulkPosLabel");
    if (pattern === "grid") {
        posWrap.style.display = "none";
    } else {
        posWrap.style.display = "flex";
        posLabel.textContent = pattern === "row" ? "Y position:" : "X position:";
    }
}

function bulkPlace() {
    if (!canEdit()) { alert("You don't have edit access"); return; }
    if (!selectedPlant) { alert("Select a plant from the palette first"); return; }
    const qty = Math.min(99, Math.max(1, parseInt(document.getElementById("bulkQty").value) || 1));
    if (!currentBedId) return;

    const bed = DATA.beds[currentBedId];
    if (!bed.plants) bed.plants = {};

    const pattern = document.getElementById("bulkPattern").value;
    const pos = parseInt(document.getElementById("bulkPos").value) || 50;
    const updates = {};
    let count = 0;

    if (pattern === "row") {
        // Horizontal line at Y=pos, evenly spaced along X
        for (let i = 0; i < qty; i++) {
            const id = genId();
            const x = qty === 1 ? 50 : Math.round((5 + (i / (qty - 1)) * 90) * 10) / 10;
            const plantData = { crop: selectedPlant.crop, variety: selectedPlant.variety, x, y: pos };
            bed.plants[id] = plantData;
            updates[id] = plantData;
        }
    } else if (pattern === "col") {
        // Vertical line at X=pos, evenly spaced along Y
        for (let i = 0; i < qty; i++) {
            const id = genId();
            const y = qty === 1 ? 50 : Math.round((5 + (i / (qty - 1)) * 90) * 10) / 10;
            const plantData = { crop: selectedPlant.crop, variety: selectedPlant.variety, x: pos, y };
            bed.plants[id] = plantData;
            updates[id] = plantData;
        }
    } else {
        // Grid (original behavior)
        const cols = Math.ceil(Math.sqrt(qty));
        const rows = Math.ceil(qty / cols);
        for (let r = 0; r < rows && count < qty; r++) {
            for (let c = 0; c < cols && count < qty; c++) {
                const id = genId();
                const x = cols === 1 ? 50 : Math.round((10 + (c / (cols - 1)) * 80) * 10) / 10;
                const y = rows === 1 ? 50 : Math.round((10 + (r / (rows - 1)) * 80) * 10) / 10;
                const plantData = { crop: selectedPlant.crop, variety: selectedPlant.variety, x, y };
                bed.plants[id] = plantData;
                updates[id] = plantData;
                count++;
            }
        }
    }

    bedsRef.child(`${currentBedId}/plants`).update(updates);
    renderBedCanvas();
    renderPlantSummary();
}

/* ─── Plant Summary (grouped list below canvas) ─── */
function renderPlantSummary() {
    if (!currentBedId) return;
    const bed = DATA.beds[currentBedId];
    const el = document.getElementById("plantSummary");

    if (!bed.plants || !Object.keys(bed.plants).length) {
        el.innerHTML = '<div class="summary-empty">No plants yet — select from the list and tap the bed</div>';
        return;
    }

    // Group by crop+variety
    const groups = {};
    Object.entries(bed.plants).forEach(([id, p]) => {
        const key = p.crop + "|" + p.variety;
        if (!groups[key]) groups[key] = { crop: p.crop, variety: p.variety, ids: [] };
        groups[key].ids.push(id);
    });

    const sorted = Object.values(groups).sort((a, b) => {
        const ai = findPlant(a.crop, a.variety);
        const bi = findPlant(b.crop, b.variety);
        return ai.displayName.localeCompare(bi.displayName);
    });

    el.innerHTML = `<div class="summary-title">Plants in this bed</div>` +
        sorted.map(g => {
            const info = findPlant(g.crop, g.variety);
            return `<div class="summary-item">
                <div class="summary-dot" style="background:${info.color}"></div>
                <span>${info.emoji}</span>
                <span>${info.displayName}</span>
                <span class="summary-qty">×${g.ids.length}</span>
                ${canEdit() ? `<button class="summary-del" title="Remove all ${info.displayName}" onclick="deleteGroup('${g.crop}','${g.variety}')">🗑️</button>` : ''}
            </div>`;
        }).join("");
}

function deleteGroup(crop, variety) {
    if (!canEdit()) return;
    if (!currentBedId) return;
    const bed = DATA.beds[currentBedId];
    if (!bed.plants) return;

    const info = findPlant(crop, variety);
    if (!confirm(`Remove all ${info.displayName} from this bed?`)) return;

    const toDelete = {};
    Object.entries(bed.plants).forEach(([id, p]) => {
        if (p.crop === crop && p.variety === variety) {
            toDelete[id] = null;
            delete bed.plants[id];
        }
    });

    bedsRef.child(`${currentBedId}/plants`).update(toDelete);
    if (selectedPlantId && !bed.plants[selectedPlantId]) selectedPlantId = null;
    renderBedCanvas();
    renderPlantSummary();
}

/* ─── Rename bed ─── */
function startRenameBed() {
    if (!canEdit()) return;
    const el = document.getElementById("bedTitle");
    const cur = el.textContent;
    const inp = document.createElement("input");
    inp.type = "text"; inp.className = "bed-title-input"; inp.value = cur;
    el.replaceWith(inp); inp.focus(); inp.select();
    function done() {
        const newName = inp.value.trim() || cur;
        DATA.beds[currentBedId].name = newName;
        bedsRef.child(`${currentBedId}/name`).set(newName);
        const sp = document.createElement("span");
        sp.className = "bed-title"; sp.id = "bedTitle"; sp.textContent = newName;
        sp.ondblclick = startRenameBed;
        inp.replaceWith(sp);
    }
    inp.addEventListener("blur", done);
    inp.addEventListener("keydown", e => { if (e.key === "Enter") done(); if (e.key === "Escape") { inp.value = cur; done(); } });
}

/* ═══════════════════════════════════════════════
   EXPORT / IMPORT / RESET
   ═══════════════════════════════════════════════ */
function exportData() {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ version: 4, beds: DATA.beds }, null, 2)], { type: "application/json" }));
    a.download = "hutts-garden.json"; a.click();
}

function importData(ev) {
    if (!canEdit()) { alert("You don't have edit access"); return; }
    const f = ev.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = e => {
        try {
            const d = JSON.parse(e.target.result);
            if (d.version === 4 && d.beds) {
                bedsRef.set(d.beds);
                alert("Imported!");
            } else if (d.version === 3 && d.beds) {
                migrateV3toV4(d);
                alert("Imported & migrated from v3!");
            } else {
                alert("Unrecognized format");
            }
        } catch (err) { alert("Invalid file"); }
    };
    r.readAsText(f); ev.target.value = "";
}

function resetData() {
    if (!canEdit()) return;
    if (!confirm("Reset ALL garden data? This cannot be undone.")) return;
    const fresh = defaultBeds();
    bedsRef.set(fresh);
    if (currentBedId) closeBedEditor();
}

/* ═══════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════ */
renderStats();
renderMap();

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
}
